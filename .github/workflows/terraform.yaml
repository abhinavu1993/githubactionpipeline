name: Terraform CI/CD Pipeline

on:
  push:
    branches:
      - feature/*
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      # Step 3: Azure Login with hardcoded values
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: "3050f33b-e253-4ddd-ba25-a30158c6d653"
          tenant-id: "9717e559-4d76-42f9-af57-c872325ab987"
          subscription-id: "af61473b-449e-4740-a263-451ee84197a7"
          creds: |
            {
              "clientId": "3050f33b-e253-4ddd-ba25-a30158c6d653",
              "clientSecret": "~Vm8Q~n5aaJ5GpV.s4xaOkOuH2_wCwhVoUfayddu",
              "subscriptionId": "af61473b-449e-4740-a263-451ee84197a7",
              "tenantId": "9717e559-4d76-42f9-af57-c872325ab987"
            }

      # Step 4: Terraform Init
      - name: Terraform Init
        run: terraform init

      # Step 5: Terraform Plan (Feature branch only)
      - name: Terraform Plan
        if: startsWith(github.ref, 'refs/heads/feature/')
        run: terraform plan

      # Step 6: Terraform Apply (Main branch only)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve
